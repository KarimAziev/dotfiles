name: Dotfiles Multi-Version CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-on-ubuntu-22:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run install script on Ubuntu 22.04
        run: |
          chmod +x ./install.sh
          ./install.sh --non-interactive
      - name: Apply dotfiles configurations on Ubuntu 22.04
        run: make install

  test-on-ubuntu-24:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run install script on Ubuntu 24.04
        run: |
          chmod +x ./install.sh
          ./install.sh --non-interactive
      - name: Apply dotfiles configurations on Ubuntu 24.04
        run: make install
